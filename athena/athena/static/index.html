<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Athena</title>
<style>
:root{--bg:#0e1116;--card:#171b22;--line:#2a313c;--tx:#eef1f5;--mut:#8b95a5;--ac:#19c37d;--warn:#f5a524;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,Tahoma,Arial,sans-serif;padding:16px}
.w{max-width:900px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;margin:0}h3{margin:0 0 8px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut);font-size:12px;margin:2px}
.chip.ok{color:var(--ac);border-color:var(--ac)}.chip.bad{color:var(--bad);border-color:var(--bad)}.chip.warn{color:var(--warn);border-color:var(--warn)}
#big{text-align:center;font-size:44px;font-weight:800;margin:8px 0;min-height:56px}
#big.u{color:var(--mut)}
.bars{display:grid;gap:5px;margin-top:8px}
.bar{display:grid;grid-template-columns:110px 1fr 46px;gap:8px;align-items:center;font-size:13px;color:var(--mut)}
.bar i{display:block;height:9px;border-radius:5px;background:var(--ac);transition:width .3s}
.bar div{background:#0e1116;border-radius:5px;overflow:hidden}
canvas{width:100%;display:block;border-radius:10px;background:#0b0e13}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0e1116;color:var(--tx);font-size:15px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.g{grid-template-columns:1fr}}
button{border:0;border-radius:10px;padding:11px 18px;font-weight:700;font-size:15px;cursor:pointer;margin-top:12px}
.p{background:var(--ac);color:#04140c}.s{background:transparent;color:var(--tx);border:1px solid var(--line);font-weight:500}
.d{background:transparent;color:var(--bad);border:1px solid var(--bad);padding:3px 10px;font-size:12px;margin:0}
button:disabled{opacity:.45;cursor:default}
.hint{color:var(--mut);font-size:12px;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:start;color:var(--mut)}td:first-child{color:var(--tx)}
progress{width:100%;height:10px;margin-top:10px}
pre{background:#0b0e13;border-radius:10px;padding:10px;font-size:12px;max-height:180px;overflow:auto;color:var(--mut);margin:10px 0 0;direction:ltr;text-align:left}
#rbig{font-size:30px;font-weight:800;text-align:center;margin-top:10px}
.lang{background:transparent;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:5px 12px;margin:0;font-size:13px}
.tile{background:#10151c;border:1px solid var(--line);border-radius:12px;padding:12px;min-height:104px}
.tile small{display:block;color:var(--mut);font-size:12px}.tile strong{display:block;font-size:21px;margin-top:5px}.tile p{color:var(--mut);font-size:12px;margin:3px 0 0;overflow-wrap:anywhere}
.tile.alert{border-color:var(--bad);background:#261719}.tile.good{border-color:var(--ac)}
button.warnbtn{background:var(--warn);color:#19130a}.subtle{font-size:12px;color:var(--mut);margin-top:8px}
</style>
</head>
<body>
<div class="w">
<div class="top"><h1>🧠 Athena <span style="color:var(--mut);font-size:13px" data-i="sub"></span></h1><button class="lang" id="lg">EN</button></div>

<div class="card">
  <h3 data-i="monitor_t"></h3>
  <div class="g">
    <div class="tile" id="presenceTile"><small data-i="presence_t"></small><strong id="presenceValue">غير معاير</strong><p id="presenceInfo"></p></div>
    <div class="tile" id="motionTile"><small data-i="motion_t"></small><strong id="motionValue">—</strong><p id="motionInfo"></p></div>
    <div class="tile" id="fallTile"><small data-i="fall_t"></small><strong id="fallValue">—</strong><p id="fallInfo"></p></div>
  </div>
  <button class="p" id="calgo" data-i="cal_go"></button>
  <button class="s" id="calstop" data-i="cal_stop"></button>
  <button class="warnbtn" id="fallack" data-i="fall_ack" style="display:none"></button>
  <div class="subtle" id="calmsg"></div>
  <div class="hint" data-i="safety_note"></div>
</div>

<div class="card">
  <h3 data-i="activity_t"></h3>
  <div id="chips"></div>
  <div id="big" class="u">…</div>
  <div class="bars" id="bars"></div>
  <div class="hint" id="modelmsg"></div>
  <canvas id="heat" height="140"></canvas>
  <div class="hint" data-i="heat_h"></div>
  <canvas id="en" height="60" style="margin-top:10px"></canvas>
</div>

<div class="card">
  <h3 data-i="rec_t"></h3>
  <div class="g">
    <div><label data-i="act"></label><select id="lab"></select></div>
    <div><label data-i="own"></label><input id="labc" placeholder="mine_1" autocomplete="off"></div>
    <div><label data-i="person"></label><input id="person" placeholder="me"></div>
    <div><label data-i="room"></label><input id="room" placeholder="living-room"></div>
    <div><label data-i="secs"></label><input id="secs" type="number" value="20" min="5" max="300"></div>
  </div>
  <div class="hint" id="labhint"></div>
  <button class="p" id="rgo" data-i="rec_go"></button>
  <button class="s" id="rstop" data-i="rec_stop"></button>
  <div id="rbig"></div>
  <div class="hint" id="rmsg"></div>
  <table id="takes"></table>
  <div class="hint" data-i="rec_tip"></div>
</div>

<div class="card">
  <h3 data-i="tr_t"></h3>
  <div class="g">
    <div><label data-i="epochs"></label><input id="ep" type="number" value="30" min="1" max="200"></div>
    <div><label><input type="checkbox" id="pre" style="width:auto"> <span data-i="pre"></span></label></div>
  </div>
  <button class="p" id="tgo" data-i="tr_go"></button>
  <button class="s" id="tstop" data-i="tr_stop"></button>
  <progress id="tpr" value="0" max="100" style="display:none"></progress>
  <div id="tres" class="hint"></div>
  <pre id="tlog" style="display:none"></pre>
</div>
</div>

<script>
const D={
ar:{sub:"استشعار CSI · التواجد والحركة والسقوط",monitor_t:"المراقبة المتكاملة · CSI",presence_t:"التواجد في الغرفة",motion_t:"الحركة",fall_t:"اكتشاف السقوط",cal_go:"عاير الغرفة وهي فاضية (10 ثواني)",cal_stop:"إلغاء المعايرة",fall_ack:"تأكيد مراجعة التنبيه وإخفاؤه",activity_t:"تصنيف النشاط المدرّب",safety_note:"تنبيه بحثي: النتائج تقديرية وليست نظام إنقاذ أو جهازًا طبيًا. راجع أي تنبيه بشريًا ولا تعتمد عليه وحده.",no_stream:"مفيش بث",fall_model_ready:"فئة fall موجودة في الموديل المدرّب",fall_model_need:"فئة fall مش متدرّبة؛ التنبيه حاليًا قاعدي وتجريبي",pres_unknown:"غير محدد",pres_yes:"فيه وجود محتمل",pres_no:"الغرفة فاضية غالبًا",pres_uncal:"غير معاير",pres_score:"مؤشر التغير",pres_cal_hint:"افرغ الغرفة ثم ابدأ المعايرة",moving:"فيه حركة",still:"ثابت حاليًا",motion_level:"شدة الحركة",motion_score:"مؤشر الحركة",fall_alert:"اشتباه سقوط — تحقّق الآن",fall_check:"فحص نمط حركة",fall_ready:"لا توجد إشارة حاليًا",impact:"شدة التغير",fall_model_p:"احتمال الموديل",cal_running:"جاري معايرة الغرفة:",heat_h:"خريطة CSI: الصفوف = الزمن، الأعمدة = الـ 64 subcarrier. التغيّر في الألوان = حركة.",
 rec_t:"1) سجّل بياناتك",act:"النشاط",own:"أو اكتب نشاط جديد",person:"اسم الشخص",room:"المكان",secs:"مدة التسجيل (ثواني)",rec_go:"ابدأ التسجيل",rec_stop:"إلغاء",
 rec_tip:"نصيحة: سجّل 10 مرات على الأقل لكل نشاط، وغيّر مكان وقوفك واتجاهك ووقت اليوم. لازم يكون فيه نشاط «empty» (الأوضة فاضية) عشان الموديل يعرف السكون.",
 tr_t:"2) درّب الموديل",epochs:"عدد الحقب",pre:"ابدأ من الموديل المدرّب القديم (تجريبي)",tr_go:"ابدأ التدريب",tr_stop:"إيقاف",
 takes:"المرات",secs_c:"ثواني",del:"مسح",
 conn:"متصل",disc:"مفيش بث من اللوحة",fps:"إطار/ث",loss:"فقد",nomodel:"لسه مفيش موديل — سجّل بيانات وبعدين درّب.",uncertain:"مش متأكد",
 st_countdown:"استعد… ",st_rec:"سجّل الحركة الآن: ",st_done:"✓ ",st_err:"✗ ",tdone:"خلص التدريب. دقة الاختبار",twarn:"الدقة دي على نفس المكان والشخص — جرّبه في أوضة تانية قبل ما تثق فيه.",
 trun:"التدريب شغال…",
 h:{empty:"الأوضة فاضية تماماً",sitting_still:"قاعد ثابت",sitting_down:"الجلوس",lying_down:"استلقاء آمن على سطح لين",fall:"سقوط تجريبي آمن تحت إشراف",walking:"مشي طبيعي",running:"جري في المكان أو حواليه",jumping:"نط",squatting:"قرفصاء",arm_wave:"تلويح بالإيد",turning:"لف حوالين نفسك"}},
en:{sub:"CSI sensing · presence, motion and fall events",monitor_t:"Integrated CSI monitor",presence_t:"Room presence",motion_t:"Motion",fall_t:"Fall detection",cal_go:"Calibrate empty room (10 seconds)",cal_stop:"Cancel calibration",fall_ack:"Acknowledge and hide alert",activity_t:"Trained activity classifier",safety_note:"Research prototype only. Results are estimates, not a medical or emergency safety system. Verify every alert in person.",no_stream:"No stream",fall_model_ready:"The trained model includes a fall class",fall_model_need:"No trained fall class; heuristic alerts are experimental",pres_unknown:"Unknown",pres_yes:"Possible presence",pres_no:"Likely empty",pres_uncal:"Not calibrated",pres_score:"Change score",pres_cal_hint:"Empty the room, then start calibration",moving:"Motion detected",still:"Currently still",motion_level:"Motion level",motion_score:"Motion score",fall_alert:"Possible fall — check now",fall_check:"Checking movement pattern",fall_ready:"No current indication",impact:"Change peak",fall_model_p:"Model probability",cal_running:"Calibrating room:",heat_h:"CSI heat-map: rows = time, columns = the 64 subcarriers. Colour changes = movement.",
 rec_t:"1) Record your data",act:"Activity",own:"or type a new one",person:"Person",room:"Place",secs:"Duration (s)",rec_go:"Start recording",rec_stop:"Cancel",
 rec_tip:"Tip: record at least 10 takes per activity, changing where you stand, your direction and the time of day. Include an “empty” activity (nobody in the room) so the model knows stillness.",
 tr_t:"2) Train the model",epochs:"Epochs",pre:"Start from the old pretrained model (experimental)",tr_go:"Start training",tr_stop:"Stop",
 takes:"Takes",secs_c:"Seconds",del:"Delete",
 conn:"connected",disc:"no stream from the board",fps:"fps",loss:"loss",nomodel:"No model yet — record data, then train.",uncertain:"uncertain",
 st_countdown:"Get ready… ",st_rec:"Do the activity now: ",st_done:"✓ ",st_err:"✗ ",tdone:"Training finished. Test accuracy",twarn:"This score is for the same place and person — test in another room before trusting it.",
 trun:"Training…",
 h:{empty:"Nobody in the room",sitting_still:"Sitting still",sitting_down:"Sitting down",lying_down:"Controlled lying on a soft surface",fall:"Safe simulated fall under adult supervision",walking:"Normal walking",running:"Running in/around the spot",jumping:"Jumping",squatting:"Squats",arm_wave:"Waving an arm",turning:"Turning on the spot"}}};
let lang=localStorage.getItem('lang')||'ar';
const $=id=>document.getElementById(id), t=k=>D[lang][k]||k;
const DEF=['empty','sitting_still','sitting_down','lying_down','walking','running','jumping','squatting','arm_wave','turning','fall'];
const api=(p,b)=>fetch(p,b===undefined?{}:{method:'POST',headers:{'X-Athena':'1','Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());
function ap(){document.documentElement.lang=lang;document.documentElement.dir=lang=='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));$('lg').textContent=lang=='ar'?'EN':'عربي';hint()}
$('lg').onclick=()=>{lang=lang=='ar'?'en':'ar';localStorage.setItem('lang',lang);ap();draw(S)};
let S=null,labFilled=false;
function hint(){$('labhint').textContent=t('h')[$('lab').value]||''}
$('lab').onchange=hint;

function drawHeat(heat){
 const c=$('heat'),W=c.width=c.clientWidth*2,H=c.height=280,x=c.getContext('2d');x.clearRect(0,0,W,H);
 if(!heat||heat.length<2)return;const n=heat.length,m=64,cw=W/m,rh=H/n;
 const mean=Array(m).fill(0);heat.forEach(r=>r.forEach((v,j)=>mean[j]+=v/n));
 heat.forEach((r,i)=>r.forEach((v,j)=>{const d=Math.max(-1,Math.min(1,(v-mean[j])/12));
  x.fillStyle=d>0?`rgb(${60+195*d},${40+40*(1-d)},${60})`:`rgb(${50},${70+60*(-d)},${90+165*(-d)})`;
  x.fillRect(j*cw,i*rh,cw+1,rh+1)}));
}
function drawEn(e){
 const c=$('en'),W=c.width=c.clientWidth*2,H=c.height=120,x=c.getContext('2d');x.clearRect(0,0,W,H);
 if(!e||e.length<2)return;const mx=Math.max(1,...e)*1.15;
 x.strokeStyle='#19c37d';x.lineWidth=3;x.beginPath();e.forEach((v,i)=>{const px=i/(e.length-1)*W,py=H-v/mx*(H-8)-4;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();
}
function draw(s){
 if(!s)return;
 const m=s.monitor||{},f=s.fall||{},c=s.calibration||{};
 const pLabels={unknown:t('pres_unknown'),present:t('pres_yes'),empty:t('pres_no')};
 $('presenceValue').textContent=!s.connected?t('no_stream'):(m.calibrated?(pLabels[m.status]||pLabels.unknown):t('pres_uncal'));
 $('presenceInfo').textContent=!s.connected?'':(m.calibrated?`${t('pres_score')}: ${m.score} · ${m.calibrated_at}`:t('pres_cal_hint'));
 $('presenceTile').className='tile '+(m.status==='present'?'good':'');
 $('motionValue').textContent=!s.connected?t('no_stream'):m.motion==='moving'?t('moving'):m.motion==='still'?t('still'):'—';
 $('motionInfo').textContent=s.connected?`${t('motion_level')}: ${m.motion_level??0} · ${t('motion_score')}: ${m.motion_score??0}`:'';
 $('motionTile').className='tile '+(m.motion==='moving'?'good':'');
 const fallText=f.status==='alert'?t('fall_alert'):!s.connected?t('no_stream'):f.status==='checking'?t('fall_check'):t('fall_ready');
 $('fallValue').textContent=fallText;
 $('fallInfo').textContent=f.event?`${f.event.time} · ${f.event.message}`:s.connected?`${s.model_has_fall?t('fall_model_ready'):t('fall_model_need')} · ${t('impact')}: ${f.impact??0}`:'';
 $('fallTile').className='tile '+(f.status==='alert'?'alert':'');
 $('fallack').style.display=f.status==='alert'?'':'none';
 $('calgo').disabled=!s.connected||c.status==='running';
 $('calstop').disabled=c.status!=='running';
 $('calmsg').textContent=c.status==='running'?`${t('cal_running')} ${c.left}s`:c.message||'';
 $('chips').innerHTML=`<span class="chip ${s.connected?'ok':'bad'}">${s.connected?t('conn'):t('disc')}</span>`+
  (s.connected?`<span class="chip">${s.fps} ${t('fps')}</span><span class="chip ${s.loss>10?'warn':''}">${t('loss')} ${s.loss}%</span><span class="chip">RSSI ${s.rssi}</span>`:'')+
  (s.error?`<span class="chip bad">${s.error}</span>`:'');
 const big=$('big'),bars=$('bars');
 if(s.pred&&s.connected){
  const u=s.pred.label=='uncertain';big.textContent=u?'❓ '+t('uncertain')+' ('+s.pred.best+')':s.pred.label;big.className=u?'u':'';
  bars.innerHTML=Object.entries(s.pred.probs).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar"><span>${k}</span><div><i style="width:${(v*100).toFixed(0)}%"></i></div><span>${(v*100).toFixed(0)}%</span></div>`).join('');
 }else{big.textContent='…';big.className='u';bars.innerHTML=''}
 $('modelmsg').textContent=s.model.loaded?'':(s.model.error||t('nomodel'));
 drawHeat(s.heat);drawEn(s.energy);
 // recorder
 const r=s.rec,busy=r.status=='countdown'||r.status=='recording';
 $('rgo').disabled=busy;$('rstop').disabled=!busy;
 $('rbig').textContent=r.status=='countdown'?r.left:(r.status=='recording'?r.left+'s':'');
 $('rmsg').textContent=r.status=='countdown'?t('st_countdown')+r.label:r.status=='recording'?t('st_rec')+r.label+' ('+r.frames+')':r.status=='done'?t('st_done')+r.msg:r.status=='error'?t('st_err')+r.msg:(r.msg||'');
 // labels
 const names=[...new Set([...DEF,...Object.keys(s.takes)])];
 if(!labFilled||$('lab').options.length!=names.length){const cur=$('lab').value;$('lab').innerHTML=names.map(n=>`<option>${n}</option>`).join('');if(cur)$('lab').value=cur;labFilled=true;hint()}
 $('takes').innerHTML='<tr><th></th><th>'+t('takes')+'</th><th>'+t('secs_c')+'</th><th></th></tr>'+Object.entries(s.takes).map(([k,v])=>`<tr><td>${k}</td><td>${v.takes}</td><td>${v.seconds}</td><td><button class="d" onclick="delLab('${k}')">${t('del')}</button></td></tr>`).join('');
 // training
 const tr=s.train,run=tr.status=='running';
 $('tgo').disabled=run;$('tstop').disabled=!run;
 $('tpr').style.display=run?'':'none';$('tpr').value=tr.epochs?tr.epoch/tr.epochs*100:0;
 $('tlog').style.display=tr.log.length?'':'none';$('tlog').textContent=tr.log.join('\n');$('tlog').scrollTop=1e6;
 $('tres').textContent=run?t('trun'):(tr.status=='done'&&tr.metrics?t('tdone')+': '+(tr.metrics.accuracy*100).toFixed(1)+'%  —  '+t('twarn'):'');
 $('pre').parentElement.style.display=s.model.pretrained_available?'':'none';
}
async function delLab(k){if(confirm(k+' ?'))await api('/api/label/delete',{label:k})}
$('rgo').onclick=async()=>{const label=($('labc').value.trim()||$('lab').value);
 const r=await api('/api/record',{label,person:$('person').value,room:$('room').value,seconds:+$('secs').value});if(!r.ok)alert(r.error)};
$('rstop').onclick=()=>api('/api/record/stop',{});
$('tgo').onclick=async()=>{const r=await api('/api/train',{epochs:+$('ep').value,pretrained:$('pre').checked});if(!r.ok)alert(r.error)};
$('tstop').onclick=()=>api('/api/train/stop',{});
$('calgo').onclick=async()=>{const r=await api('/api/calibrate',{seconds:10});if(!r.ok)alert(r.error)};
$('calstop').onclick=()=>api('/api/calibrate/stop',{});
$('fallack').onclick=()=>api('/api/fall/ack',{});
async function poll(){try{S=await api('/api/state');draw(S)}catch(e){}setTimeout(poll,500)}
ap();poll();
</script>
</body>
</html>
